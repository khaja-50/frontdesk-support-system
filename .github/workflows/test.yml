name: Frontdesk checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run syntax check
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Install browser for interface checks
        run: npx playwright install --with-deps chromium
      - name: Check desktop, tablet and mobile workflows
        run: npm run test:browser
      - name: Save browser evidence if a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
