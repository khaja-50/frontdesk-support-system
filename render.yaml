services:
  - type: web
    name: frontdesk-support-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /app/data/frontdesk.sqlite
    disk:
      name: frontdesk-data
      mountPath: /app/data
      sizeGB: 1
