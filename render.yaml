services:
  - type: web
    name: frontdesk-support-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: frontdesk-db
          property: connectionString

databases:
  - name: frontdesk-db
    plan: free
