<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontdesk | Support operations</title><link rel="stylesheet" href="/styles.css"></head><body><header><div><p class="eyebrow">NORTHSTAR SUPPORT</p><h1>Frontdesk</h1><p class="muted">A calmer way to keep customer promises.</p></div><div class="agent"><span class="status-dot"></span><span>Signed in as <strong>Demo agent</strong></span></div></header><main><section class="toolbar"><div><p class="eyebrow">AGENT WORKSPACE</p><h2>Ticket queue</h2></div><button id="new-ticket">New ticket</button></section><section id="stats" class="stats"></section><section id="tickets" class="ticket-grid"></section></main><dialog id="ticket-dialog"><form method="dialog" id="ticket-form"><button class="close" value="cancel">×</button><p class="eyebrow">NEW CUSTOMER ISSUE</p><h2>Open a ticket</h2><label>Subject<input name="subject" required placeholder="What does the customer need?"></label><label>Customer email<input type="email" name="customer_email" required placeholder="name@example.com"></label><label>Priority<select name="priority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option></select></label><label>Description<textarea name="description" required rows="5" placeholder="Add the useful context..."></textarea></label><button class="primary" value="default">Create ticket</button></form></dialog><script src="/app.js"></script></body></html>
